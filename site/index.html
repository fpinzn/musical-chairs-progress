<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Musical Chairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #e8e8e8;
    --dim: #6f6f6f;
    --faint: #2a2a2a;
    --line: #8fd3ff;
    --today: #ffd23f;
    --front: #ffffff;
    --red: #dd0000;
    --green: #13a34a;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  body { padding: 16px; max-width: 1180px; margin: 0 auto; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

  /* Cartouche */
  .cartouche { border: 1px solid var(--dim); padding: 12px 14px; margin-bottom: 18px; position: relative; }
  .cartouche::before, .cartouche::after { content: ""; position: absolute; width: 6px; height: 6px; background: var(--ink); }
  .cartouche::before { top: -1px; left: -1px; }
  .cartouche::after { bottom: -1px; right: -1px; }
  .cartouche h1 { margin: 0 0 8px; font-size: 14px; letter-spacing: .18em; font-weight: 700; }
  .cartouche .row { display: flex; flex-wrap: wrap; gap: 6px 26px; font-size: 12px; }
  .cartouche .row > div { min-width: 0; max-width: 100%; }
  .cartouche .k { color: var(--dim); letter-spacing: .1em; font-size: 10px; display: block; }
  .cartouche .v { font-size: 16px; overflow-wrap: anywhere; }
  .cartouche .v.big { font-size: clamp(18px, 5.5vw, 26px); font-weight: 700; }
  .ahead { color: var(--green); } .behind { color: var(--red); } .even { color: var(--ink); }
  .stale { color: var(--red); }

  /* Strip */
  section h2 { font-size: 10px; letter-spacing: .18em; color: var(--dim); margin: 0 0 6px; font-weight: 400; }
  .strip-wrap { overflow-x: auto; border-top: 1px solid var(--faint); border-bottom: 1px solid var(--faint); padding: 8px 0; margin-bottom: 26px; }
  #stripCanvas { cursor: crosshair; }

  /* Figure */
  .figure-wrap { position: relative; margin: 0 auto; width: 100%; max-width: calc(92vh * 0.5556); }
  .figure-wrap::before { content: ""; display: block; padding-top: 180%; }
  .figure-wrap > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #figCanvas { cursor: crosshair; }
  #figSvg { pointer-events: none; }
  #figLabels { pointer-events: none; }
  .lbl { position: absolute; font-size: 10px; letter-spacing: .08em; white-space: nowrap; line-height: 1;
         padding: 1px 3px; background: rgba(0,0,0,.72); pointer-events: auto; }
  .lbl.date { color: var(--line); transform: translate(0, -50%); }
  .lbl.today { color: var(--today); font-weight: 700; }
  .lbl.front { color: var(--front); transform: translate(0, -50%); }
  .lbl.ms { color: var(--ink); text-align: right; transform: translate(0, -50%); cursor: pointer; }
  .lbl.ms .n { color: var(--dim); }
  .lbl.ms.hot { color: var(--today); }
  .lbl.axis { color: var(--line); transform: translate(-50%, 0); font-size: 9px; }

  @keyframes march { to { stroke-dashoffset: -24; } }
  .todayline { animation: march 1.6s linear infinite; }

  /* Tooltip and callout */
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 300px;
         background: #000; border: 1px solid var(--dim); padding: 8px 10px; font-size: 11px; line-height: 1.45; }
  #tip .id { color: var(--today); font-weight: 700; }
  #tip .meta { color: var(--dim); }
  #callout { position: fixed; z-index: 11; display: none; background: #000; border: 1px solid var(--ink);
             padding: 10px 12px; font-size: 11px; line-height: 1.5; max-width: 360px; max-height: 70vh; overflow: auto; }
  #callout h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .14em; }
  #callout .t { display: grid; grid-template-columns: 14px 56px 1fr 46px; gap: 0 8px; }
  #callout .t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #callout .s-done { color: var(--green); } #callout .s-started { color: var(--today); }
  #callout .s-pocket { color: var(--red); } #callout .s-blocked, #callout .s-todo { color: var(--dim); }
  #callout .x { position: absolute; top: 6px; right: 8px; cursor: pointer; color: var(--dim); }

  .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 10px; color: var(--dim); letter-spacing: .08em; margin: 22px 0 8px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--dim); }
  .legend i.done { background: #d33; border-color: #d33; }
  .legend i.started { background: repeating-linear-gradient(90deg, #d33 0 3px, #223 3px 6px); border-color: #555; }
  .legend i.todo { background: #223; border-color: #334; }
  .legend i.blocked { background: #0b0b14; border-color: #222; }
  .legend i.pocket { background: repeating-linear-gradient(45deg, var(--red) 0 2px, transparent 2px 5px); border-color: var(--red); }
  .legend i.salient { background: repeating-linear-gradient(-45deg, var(--line) 0 2px, transparent 2px 5px); border-color: var(--line); }
  footer { font-size: 10px; color: var(--dim); letter-spacing: .08em; margin-top: 10px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>

<header class="cartouche">
  <h1>OPERATION MUSICAL CHAIRS</h1>
  <div class="row">
    <div><span class="k">FRONT AS OF</span><span class="v" id="cToday">—</span></div>
    <div><span class="k">DONE</span><span class="v" id="cDone">—</span></div>
    <div><span class="k">PLANNED BY TODAY</span><span class="v" id="cPlanned">—</span></div>

    <div><span class="k">SOURCE</span><span class="v" id="cUpdated">—</span></div>
  </div>
</header>

<section>
  <h2>ORDER OF BATTLE · ONE CELL = ONE TENTH OF A DAY</h2>
  <div class="strip-wrap"><canvas id="stripCanvas"></canvas></div>
</section>

<section>
  <h2>THE FRONT</h2>
  <div class="figure-wrap" id="figWrap">
    <canvas id="figCanvas"></canvas>
    <svg id="figSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <pattern id="hatchRed" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="2.2" height="6" fill="#dd0000"/>
        </pattern>
        <pattern id="hatchCyan" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
          <rect width="2" height="6" fill="#8fd3ff"/>
        </pattern>
      </defs>
      <g id="gHatch"></g>
      <g id="gPhase"></g>
      <g id="gAxis"></g>
      <g id="gFront"></g>
      <g id="gToday"></g>
      <g id="gLeaders"></g>
    </svg>
    <div id="figLabels"></div>
  </div>
</section>

<div class="legend">
  <span><i class="done"></i>DONE</span>
  <span><i class="started"></i>IN PROGRESS</span>
  <span><i class="todo"></i>TO DO</span>
  <span><i class="blocked"></i>BLOCKED</span>
  <span><i class="pocket"></i>OVERDUE POCKET</span>
  <span><i class="salient"></i>AHEAD SALIENT</span>
</div>
<footer>GLYPHS FROM ASCII MAN · DATA FROM LINEAR · <span id="fNote"></span></footer>

<div id="tip"></div>
<div id="callout"><span class="x">✕</span><div id="calloutBody"></div></div>

<script>
// ── Constants ────────────────────────────────────────────────────────────
const CELL = 16, SHEET_COLS = 18;
const MODEL_NOISE = 0, MODEL_AUTOMATA = 1, MODEL_TRUE = 2;
const FRAME_MS = 110;
const REFRESH_MS = 5 * 60 * 1000;
const STALE_MS = 90 * 60 * 1000;
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

const params = new URLSearchParams(location.search);
const TODAY = params.get("today") ? parseDate(params.get("today")) : localToday();
const SIM = params.get("sim") ? parseFloat(params.get("sim")) : null;

// ── State ────────────────────────────────────────────────────────────────
let ROWS, COLS, NUM_FRAMES, modelFrames;
let sheetDay, sheetNight;
let body;            // {runs}
let bodyCells = [];  // [{r,c}] bottom-up scanline order
let cellOrder;       // Int32Array ROWS*COLS -> index in bodyCells or -1
let cellTask;        // Array bodyCells.length -> task
let progress = null; // raw JSON
let M = null;        // derived model
let frameIdx = 0, lastTick = 0;
let hoverTask = null;

// ── Helpers ──────────────────────────────────────────────────────────────
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function localToday() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
function fmt(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function fmtLong(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDays(x) { return `${x.toFixed(1)} d`; }
function hash(i, f) { let h = (i * 2654435761 + f * 40503) >>> 0; h ^= h >>> 13; h = (h * 0x5bd1e995) >>> 0; return (h >>> 8) / 16777216; }

// ── Loading ──────────────────────────────────────────────────────────────
async function gunzip(buf) {
  const bytes = new Uint8Array(buf);
  if (!(bytes[0] === 0x1f && bytes[1] === 0x8b)) return buf;  // already inflated by the browser
  if (typeof DecompressionStream === "function") {
    return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  }
  await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js"; sc.onload = res; sc.onerror = () => rej(new Error("pako failed to load")); document.head.appendChild(sc); });
  return window.pako.ungzip(bytes).buffer;
}
async function loadFrames() {
  const resp = await fetch("data/frames.bin.gz");
  if (!resp.ok) throw new Error("frames " + resp.status);
  const buf = await gunzip(await resp.arrayBuffer());
  const view = new DataView(buf);
  const rows = view.getUint16(0, true), cols = view.getUint16(2, true);
  if (ROWS && (rows !== ROWS || cols !== COLS)) throw new Error("frame grid mismatch");
  ROWS = rows; COLS = cols;
  const numUnique = view.getUint16(4, true); NUM_FRAMES = view.getUint16(6, true);
  const tableStart = 8 + 11;
  const offsets = [];
  for (let i = 0; i < numUnique; i++) offsets.push(view.getUint32(tableStart + i * 4, true));
  const dataStart = tableStart + numUnique * 4;
  const cells = ROWS * COLS, bitmaskBytes = Math.ceil(cells / 8);
  modelFrames = [];
  for (let ui = 0; ui < numUnique; ui++) {
    let pos = dataStart + offsets[ui] + 4;
    const frames = [new Uint16Array(buf.slice(pos, pos + cells * 2))];
    pos += cells * 2;
    for (let fi = 1; fi < NUM_FRAMES; fi++) {
      const frame = new Uint16Array(frames[fi - 1]);
      const bitmask = new Uint8Array(buf, pos, bitmaskBytes); pos += bitmaskBytes;
      for (let i = 0; i < cells; i++) if (bitmask[i >> 3] & (1 << (i & 7))) { frame[i] = view.getUint16(pos, true); pos += 2; }
      frames.push(frame);
    }
    modelFrames.push(frames);
  }
}
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function loadJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }

let cellExtra;  // 0 none, 1 blank (skip), 2 accent (always lit)
function buildBody() {
  cellOrder = new Int32Array(ROWS * COLS).fill(-1);
  cellExtra = new Uint8Array(ROWS * COLS);
  bodyCells = [];
  for (let r = ROWS - 1; r >= 0; r--) for (const [s, e] of body.runs[r]) for (let c = s; c < e; c++) { cellOrder[r * COLS + c] = bodyCells.length; bodyCells.push({ r, c }); }
  for (let r = 0; r < ROWS; r++) {
    for (const [s, e] of (body.blank || [])[r] || []) for (let c = s; c < e; c++) cellExtra[r * COLS + c] = 1;
    for (const [s, e] of (body.accent || [])[r] || []) for (let c = s; c < e; c++) cellExtra[r * COLS + c] = 2;
  }
}

// ── Derived model ────────────────────────────────────────────────────────
function buildModel() {
  const all = progress.tasks.filter(t => t.status !== "canceled").map(t => ({ ...t, dueDate: t.due ? parseDate(t.due) : null }));
  const byId = Object.fromEntries(all.map(t => [t.id, t]));
  const core = all.filter(t => t.dueDate && t.effort != null && /^M[0-7]$/.test(t.milestone));
  const extra = all.filter(t => !core.includes(t));

  // Dependency level and longest path to MC-064 (critical path).
  const level = {}, early = {};
  const lvl = t => level[t.id] ??= t.blockedBy.filter(b => byId[b]).reduce((m, b) => Math.max(m, lvl(byId[b]) + 1), 0);
  const erl = t => early[t.id] ??= (t.effort || 0) + t.blockedBy.filter(b => byId[b]).reduce((m, b) => Math.max(m, erl(byId[b])), 0);
  all.forEach(t => { lvl(t); erl(t); });
  const critical = new Set();
  let cur = byId["MC-064"];
  while (cur) { critical.add(cur.id); const prev = cur.blockedBy.filter(b => byId[b]).map(b => byId[b]).sort((a, b) => erl(b) - erl(a))[0]; cur = prev; }

  // Simulation: mark the first N days of the ordered plan done.
  core.sort((a, b) => a.dueDate - b.dueDate || level[a.id] - level[b.id] || a.id.localeCompare(b.id));
  if (SIM != null) { let acc = 0; core.forEach(t => { acc += t.effort; t.status = acc <= SIM + 1e-9 ? "completed" : (acc - t.effort < SIM ? "started" : "backlog"); }); }

  const done = t => t.status === "completed";
  const total = core.reduce((s, t) => s + t.effort, 0);
  const cellsPerDay = bodyCells.length / total;
  cellTask = new Array(bodyCells.length).fill(null);
  let acc = 0, idx = 0;
  core.forEach((t, i) => {
    acc += t.effort;
    const end = i === core.length - 1 ? bodyCells.length : Math.round(acc * cellsPerDay);
    t.start = idx; t.end = end; t.cells = [];
    for (let k = idx; k < end; k++) { cellTask[k] = t; t.cells.push(k); }
    idx = end;
  });
  all.forEach(t => {
    t.blocked = t.status === "backlog" && t.blockedBy.some(b => byId[b] && !done(byId[b]));
    t.state = done(t) ? "done" : t.status === "started" ? "started" : t.blocked ? "blocked" : "todo";
    t.pocket = !done(t) && t.dueDate && t.dueDate <= TODAY;
    t.salient = done(t) && t.dueDate && t.dueDate > TODAY;
    t.critical = critical.has(t.id);
    t.level = level[t.id];
  });

  // Phase boundaries by due date, planned index today by linear interpolation.
  const dues = [...new Set(core.map(t => t.due))].sort();
  const phases = dues.map(d => ({ due: d, date: parseDate(d), end: Math.max(...core.filter(t => t.due === d).map(t => t.end)), effort: core.filter(t => t.due <= d).reduce((s, t) => s + t.effort, 0) }));
  let plannedEffort = 0, plannedIndex = 0;
  {
    const first = phases[0], last = phases[phases.length - 1];
    if (TODAY >= last.date) { plannedEffort = last.effort; plannedIndex = last.end; }
    else if (TODAY >= first.date) {
      let i = 0; while (i + 1 < phases.length && phases[i + 1].date <= TODAY) i++;
      const a = phases[i], b = phases[i + 1];
      const f = Math.min(1, Math.max(0, dayDiff(a.date, TODAY) / dayDiff(a.date, b.date)));
      plannedEffort = a.effort + f * (b.effort - a.effort);
      plannedIndex = Math.round(a.end + f * (b.end - a.end));
    } else {
      // Ramp from zero over the working days before the first due date.
      const start = new Date(first.date); start.setDate(start.getDate() - 1);
      plannedEffort = TODAY >= start ? first.effort * 0.5 : 0; plannedIndex = Math.round(plannedEffort * cellsPerDay);
    }
  }
  const doneEffort = core.filter(done).reduce((s, t) => s + t.effort, 0);
  const doneIndex = Math.round(doneEffort * cellsPerDay);

  // Milestone bands (rows covered) and counts.
  const milestones = [];
  for (const m of [...new Set(all.map(t => t.milestone))].sort()) {
    const ts = all.filter(t => t.milestone === m);
    const cells = ts.flatMap(t => t.cells || []);
    const rows = cells.map(k => bodyCells[k].r);
    milestones.push({
      id: m, name: (ts[0].milestoneName || m).replace(/^M\d\s*/, "").replace(/\s*\(backlog\)/i, "").toUpperCase(),
      tasks: ts, effort: ts.reduce((s, t) => s + (t.effort || 0), 0), done: ts.filter(done).length,
      rowMin: rows.length ? Math.min(...rows) : null, rowMax: rows.length ? Math.max(...rows) : null, core: /^M[0-7]$/.test(m),
    });
  }

  M = { all, byId, core, extra, total, cellsPerDay, phases, plannedEffort, plannedIndex, doneEffort, doneIndex, milestones, critical };
}

// ── Cell appearance ──────────────────────────────────────────────────────
function cellLook(k, f) {
  const t = cellTask[k];
  if (!t) return { model: MODEL_TRUE, sheet: sheetNight, alpha: 0.5 };
  switch (t.state) {
    case "done": return { model: MODEL_TRUE, sheet: sheetDay, alpha: 1 };
    case "started": return { model: MODEL_AUTOMATA, sheet: hash(k, Math.floor(f / 2)) < 0.5 ? sheetDay : sheetNight, alpha: 1 };
    case "blocked": return { model: MODEL_NOISE, sheet: sheetNight, alpha: 0.38 };
    default: return { model: MODEL_NOISE, sheet: sheetNight, alpha: 1 };
  }
}

// ── Figure rendering ─────────────────────────────────────────────────────
const figCanvas = document.getElementById("figCanvas");
const figCtx = figCanvas.getContext("2d");
function pingpong(f) { const cycle = (NUM_FRAMES - 1) * 2, p = f % cycle; return p < NUM_FRAMES ? p : cycle - p; }

const STATE_FILL = { done: "#dd0000", started: "#ffd23f", blocked: "#0b0b14", todo: "#1c2233" };
function drawStatic() {
  figCtx.clearRect(0, 0, figCanvas.width, figCanvas.height);
  for (let k = 0; k < bodyCells.length; k++) {
    const { r, c } = bodyCells[k], t = cellTask[k];
    figCtx.fillStyle = t ? STATE_FILL[t.state] : "#101018";
    figCtx.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
  }
  if (!stripLayout) return;
  sctx.setTransform(stripLayout.dpr, 0, 0, stripLayout.dpr, 0, 0);
  sctx.clearRect(0, 0, stripLayout.w, stripLayout.h);
  for (const h of stripHits) { sctx.fillStyle = STATE_FILL[h.t.state]; sctx.fillRect(h.x + 1, h.y + 1, h.w - 2, h.h - 2); }
}
function drawFigure(f) {
  const fi = pingpong(f);
  const ringFrame = modelFrames[MODEL_TRUE][fi];
  const frames = [modelFrames[MODEL_NOISE][fi], modelFrames[MODEL_AUTOMATA][fi], ringFrame];
  figCtx.clearRect(0, 0, figCanvas.width, figCanvas.height);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c, k = cellOrder[i];
    let look;
    if (k < 0) {
      if (cellExtra[i] === 1) continue;
      look = cellExtra[i] === 2 ? { model: MODEL_TRUE, sheet: sheetDay, alpha: 1 } : { model: MODEL_TRUE, sheet: sheetNight, alpha: M.doneEffort >= M.total - 1e-9 ? 1 : 0.5 };
    }
    else look = cellLook(k, f);
    const g = frames[look.model][k >= 0 && body.source ? body.source[k] : i];
    figCtx.globalAlpha = look.alpha;
    figCtx.drawImage(look.sheet, (g % SHEET_COLS) * CELL, Math.floor(g / SHEET_COLS) * CELL, CELL, CELL, c * CELL, r * CELL, CELL, CELL);
  }
  figCtx.globalAlpha = 1;
  if (hoverTask && hoverTask.cells) {
    figCtx.strokeStyle = "#ffd23f"; figCtx.lineWidth = 2;
    for (const k of hoverTask.cells) { const { r, c } = bodyCells[k]; figCtx.strokeRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2); }
  }
}

// Contour of the fill level b: edges between cells with order < b and body cells with order >= b.
// With `silhouette` the outer edges are returned instead, once, for the body outline.
function contourPath(b, silhouette) {
  const ord = (r, c) => (r < 0 || r >= ROWS || c < 0 || c >= COLS) ? -1 : cellOrder[r * COLS + c];
  let d = "";
  const n = silhouette ? bodyCells.length : Math.min(b, bodyCells.length);
  for (let k = 0; k < n; k++) {
    const { r, c } = bodyCells[k], x = c * CELL, y = r * CELL;
    for (const [dr, dc, seg] of [[-1, 0, `M${x} ${y}H${x + CELL}`], [1, 0, `M${x} ${y + CELL}H${x + CELL}`], [0, 1, `M${x + CELL} ${y}V${y + CELL}`], [0, -1, `M${x} ${y}V${y + CELL}`]]) {
      const o = ord(r + dr, c + dc);
      if (silhouette ? o < 0 : (o >= b)) d += seg;
    }
  }
  return d;
}
function svgEl(name, attrs) { const e = document.createElementNS("http://www.w3.org/2000/svg", name); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; }

function buildOverlay() {
  const svg = document.getElementById("figSvg");
  svg.setAttribute("viewBox", `0 0 ${COLS * CELL} ${ROWS * CELL}`);
  const W = COLS * CELL, H = ROWS * CELL;
  const gHatch = document.getElementById("gHatch"), gPhase = document.getElementById("gPhase"), gAxis = document.getElementById("gAxis");
  const gFront = document.getElementById("gFront"), gToday = document.getElementById("gToday"), gLeaders = document.getElementById("gLeaders");
  const labels = document.getElementById("figLabels");
  [gHatch, gPhase, gAxis, gFront, gToday, gLeaders].forEach(g => g.replaceChildren());
  labels.replaceChildren();
  const lbl = (cls, xPct, yPct, html) => { const d = document.createElement("div"); d.className = "lbl " + cls; d.style.left = xPct + "%"; d.style.top = yPct + "%"; d.innerHTML = html; labels.appendChild(d); return d; };
  const rowTopPct = k => (bodyCells[Math.max(0, Math.min(k, bodyCells.length) - 1)].r * CELL) / H * 100;

  // Hatches for pockets and salients.
  for (const t of M.core) {
    if (!t.pocket && !t.salient) continue;
    for (const k of t.cells) { const { r, c } = bodyCells[k]; gHatch.appendChild(svgEl("rect", { x: c * CELL, y: r * CELL, width: CELL, height: CELL, fill: t.pocket ? "url(#hatchRed)" : "url(#hatchCyan)", opacity: 0.85 })); }
  }

  // Silhouette once, faint.
  gPhase.appendChild(svgEl("path", { d: contourPath(0, true), fill: "none", stroke: "#8fd3ff", "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0.22 }));

  // Phase lines with dates on the left flank.
  const leftX = 1.5, dateLabels = [];
  for (const p of M.phases) {
    gPhase.appendChild(svgEl("path", { d: contourPath(p.end), fill: "none", stroke: "#8fd3ff", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke", opacity: 0.8 }));
    const y = rowTopPct(p.end);
    gPhase.appendChild(svgEl("line", { x1: 0, y1: y / 100 * H, x2: W * 0.16, y2: y / 100 * H, stroke: "#8fd3ff", "stroke-width": 1, "vector-effect": "non-scaling-stroke", "stroke-dasharray": "2 4", opacity: 0.5 }));
    dateLabels.push({ el: lbl("date", leftX, y, fmt(p.date)), y });
  }

  // Planned front today.
  if (M.plannedIndex > 0) {
    const y = rowTopPct(M.plannedIndex);
    gToday.appendChild(svgEl("path", { class: "todayline", d: contourPath(M.plannedIndex), fill: "none", stroke: "#ffd23f", "stroke-width": 2.5, "vector-effect": "non-scaling-stroke", "stroke-dasharray": "10 6" }));
    gToday.appendChild(svgEl("line", { x1: 0, y1: y / 100 * H, x2: W, y2: y / 100 * H, stroke: "#ffd23f", "stroke-width": 1, "vector-effect": "non-scaling-stroke", "stroke-dasharray": "1 5", opacity: 0.6 }));
    dateLabels.push({ el: lbl("date today", leftX, y, `PLAN ${fmt(TODAY)} · ${fmtDays(M.plannedEffort)}`), y });
  } else {
    dateLabels.push({ el: lbl("date today", leftX, rowTopPct(1) + 1.2, `PLAN ${fmt(TODAY)} · ${fmtDays(M.plannedEffort)}`), y: rowTopPct(1) + 1.2 });
  }

  // Actual front summary line.
  if (M.doneIndex > 0) {
    const y = rowTopPct(M.doneIndex);
    gFront.appendChild(svgEl("line", { x1: 0, y1: y / 100 * H, x2: W, y2: y / 100 * H, stroke: "#fff", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }));
    dateLabels.push({ el: lbl("front", leftX, y, `FRONT ${fmtDays(M.doneEffort)}`), y });
  }
  relax(dateLabels);

  // Axis of advance: the critical path up the centre of the body.
  const cx = (() => { let mn = COLS, mx = 0; for (const { c } of bodyCells) { mn = Math.min(mn, c); mx = Math.max(mx, c); } return (mn + mx + 1) / 2 * CELL; })();
  const critRows = new Set(); for (const t of M.core) if (t.critical) for (const k of t.cells) critRows.add(bodyCells[k].r);
  let segs = "";
  for (const t of M.core) if (t.critical) {
    const rs = t.cells.map(k => bodyCells[k].r); const top = Math.min(...rs) * CELL, bot = (Math.max(...rs) + 1) * CELL;
    segs += `M${cx} ${bot}V${top}`;
    gAxis.appendChild(svgEl("path", { d: `M${cx - 5} ${top + 6}L${cx} ${top}L${cx + 5} ${top + 6}`, fill: "none", stroke: "#8fd3ff", "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0.8 }));
  }
  gAxis.appendChild(svgEl("path", { d: segs, fill: "none", stroke: "#8fd3ff", "stroke-width": 1, "vector-effect": "non-scaling-stroke", "stroke-dasharray": "3 3", opacity: 0.8 }));
  if (critRows.size) lbl("axis", cx / W * 100, (Math.min(...critRows) * CELL) / H * 100 - 1.6, "AXIS · CRITICAL PATH");

  // Milestone callouts on the right flank.
  const msLabels = [];
  for (const m of M.milestones) {
    if (m.rowMin == null) continue;
    const mid = (m.rowMin + m.rowMax + 1) / 2 * CELL;
    let edge = 0; for (let r = m.rowMin; r <= m.rowMax; r++) for (const [s, e] of body.runs[r]) edge = Math.max(edge, e * CELL);
    const lx = W * 0.86;
    gLeaders.appendChild(svgEl("path", { d: `M${edge + 4} ${mid}H${lx}`, fill: "none", stroke: "#e8e8e8", "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0.55 }));
    gLeaders.appendChild(svgEl("rect", { x: edge + 1, y: mid - 3, width: 6, height: 6, fill: "#e8e8e8" }));
    const hot = m.tasks.some(t => t.pocket) ? " hot" : "";
    const narrow = document.getElementById("figWrap").clientWidth < 520;
    const text = narrow ? `${m.id} · ${m.done}/${m.tasks.length}` : `${m.id} ${m.name}<br><span class="n">${fmtDays(m.effort)} · ${m.done}/${m.tasks.length}</span>`;
    const el = lbl("ms" + hot, 0, mid / H * 100, text);
    el.style.left = ""; el.style.right = "1%";
    el.addEventListener("click", ev => { ev.stopPropagation(); showCallout(m, ev); });
    msLabels.push({ el, y: mid / H * 100 });
  }
  relax(msLabels);
}

// Push labels apart vertically so none overlap (positions in % of the wrap height).
function relax(items) {
  const wrap = document.getElementById("figWrap"); const hPx = wrap.clientHeight || 1000;
  items.sort((a, b) => a.y - b.y);
  const minGap = 13 / hPx * 100 * (items.length && items[0].el.classList.contains("ms") ? 2.3 : 1);
  for (let pass = 0; pass < 6; pass++) for (let i = 1; i < items.length; i++) if (items[i].y - items[i - 1].y < minGap) { const push = (minGap - (items[i].y - items[i - 1].y)) / 2; items[i - 1].y -= push; items[i].y += push; }
  for (const it of items) it.el.style.top = it.y + "%";
}

// ── Strip rendering ──────────────────────────────────────────────────────
// Wide screens: label column on the left, one line of cells per milestone.
// Narrow screens: the title on its own line, cells wrapped underneath like terminal text.
const strip = document.getElementById("stripCanvas");
const sctx = strip.getContext("2d");
const S = { cell: CELL, lineH: 44, padL: 8, labelCol: 236, headH: 30, gap: 10 };
let stripHits = [], stripLayout = null;

function layoutStrip() {
  const avail = Math.max(300, strip.parentElement.clientWidth);
  const rows = M.milestones.filter(m => m.tasks.length);
  const maxCells = Math.max(...rows.map(m => m.tasks.reduce((s, t) => s + Math.max(1, Math.round((t.effort || 0) * 10)), 0)));
  const wide = avail >= S.labelCol + maxCells * S.cell + 40;
  const x0 = wide ? S.labelCol : S.padL;
  const perLine = wide ? Infinity : Math.max(6, Math.floor((avail - x0 - S.padL) / S.cell));
  const lineH = wide ? 56 : S.lineH;
  stripHits = [];
  let y = 22;
  rows.forEach(m => {
    const ts = [...m.tasks].sort((a, b) => (a.due || "9").localeCompare(b.due || "9") || a.level - b.level || a.id.localeCompare(b.id));
    const rowTop = y;
    if (!wide) y += S.headH;
    let col = 0, lineY = y, lines = 1;
    for (const t of ts) {
      const n = Math.max(1, Math.round((t.effort || 0) * 10));
      t.strip = { n, cells: [] };
      for (let j = 0; j < n; j++) {
        if (col >= perLine) { col = 0; lineY += lineH; lines++; }
        const k = t.cells && t.cells.length ? t.cells[Math.floor((j + 0.5) / n * t.cells.length)] : null;
        const cx = x0 + col * S.cell;
        t.strip.cells.push({ x: cx, y: lineY, k });
        stripHits.push({ x: cx, y: lineY, w: S.cell, h: S.cell, t });
        col++;
      }
    }
    m.stripRow = { top: rowTop, y, tasks: ts, wide };
    y = lineY + lineH + (wide ? 0 : S.gap);
  });
  const w = wide ? Math.max(avail, x0 + maxCells * S.cell + 40) : avail;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  strip.width = Math.round(w * dpr); strip.height = Math.round((y + 4) * dpr);
  strip.style.width = w + "px"; strip.style.height = (y + 4) + "px";
  stripLayout = { wide, dpr, w, h: y + 4, x0 };
}

function blitCell(ctx, look, g, x, y) {
  ctx.globalAlpha = look.alpha;
  ctx.drawImage(look.sheet, (g % SHEET_COLS) * CELL, Math.floor(g / SHEET_COLS) * CELL, CELL, CELL, x, y, S.cell, S.cell);
  ctx.globalAlpha = 1;
}

function drawStrip(f) {
  if (!stripLayout) return;
  const { wide, dpr, w, h, x0 } = stripLayout;
  const fi = pingpong(f);
  const frames = [modelFrames[MODEL_NOISE][fi], modelFrames[MODEL_AUTOMATA][fi], modelFrames[MODEL_TRUE][fi]];
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  sctx.textBaseline = "top";
  if (wide) {
    sctx.fillStyle = "#6f6f6f"; sctx.font = "10px JetBrains Mono, monospace";
    for (let d = 0; x0 + d * 10 * S.cell < w - 40; d++) { const x = x0 + d * 10 * S.cell; sctx.fillRect(x, 14, 1, 6); sctx.fillText(`${d}d`, x + 3, 2); }
  }
  for (const m of M.milestones) {
    if (!m.stripRow) continue;
    const { top, tasks } = m.stripRow;
    sctx.fillStyle = m.core ? "#e8e8e8" : "#6f6f6f"; sctx.font = "bold 10px JetBrains Mono, monospace";
    const title = `${m.id} ${m.name}`, stats = `${fmtDays(m.effort)} · ${m.done}/${m.tasks.length}`;
    if (wide) { sctx.fillText(title.slice(0, 34), S.padL, top + 2); sctx.font = "10px JetBrains Mono, monospace"; sctx.fillStyle = "#6f6f6f"; sctx.fillText(stats, S.padL, top + 15); }
    else { sctx.fillText(title, S.padL, top + 2); sctx.font = "10px JetBrains Mono, monospace"; sctx.fillStyle = "#6f6f6f"; sctx.fillText(stats, S.padL + 6.2 * title.length + 10, top + 2); }
    let lastLabel = { y: -1, x: -1e9 }, lastDue = null, lastDate = { y: -1, x: -1e9 };
    for (const t of tasks) {
      const cells = t.strip.cells, first = cells[0], last = cells[cells.length - 1];
      cells.forEach(({ x, y, k }, j) => {
        let look, g;
        if (k == null) { look = { model: MODEL_NOISE, sheet: sheetNight, alpha: 0.5 }; g = frames[MODEL_NOISE][(j * 37 + t.id.charCodeAt(4) * 11) % (ROWS * COLS)]; }
        else { look = cellLook(k, f); const { r, c } = bodyCells[k]; g = frames[look.model][body.source ? body.source[k] : r * COLS + c]; }
        blitCell(sctx, look, g, x, y);
        if (t.pocket || t.salient) {
          sctx.strokeStyle = t.pocket ? "#dd0000" : "#8fd3ff"; sctx.lineWidth = 1;
          sctx.beginPath(); sctx.moveTo(x, y + S.cell); sctx.lineTo(x + S.cell, y); sctx.stroke();
          sctx.strokeRect(x + 0.5, y + 0.5, S.cell - 1, S.cell - 1);
        }
        if (hoverTask === t) { sctx.strokeStyle = "#ffd23f"; sctx.lineWidth = 2; sctx.strokeRect(x + 1, y + 1, S.cell - 2, S.cell - 2); sctx.lineWidth = 1; }
      });
      // Id under the first cell of the run, skipped on collision.
      if (first.y !== lastLabel.y || first.x >= lastLabel.x) { sctx.fillStyle = t.critical ? "#8fd3ff" : "#6f6f6f"; sctx.fillText(t.id.slice(3), first.x + 1, first.y + S.cell + 3); lastLabel = { y: first.y, x: first.x + 26 }; }
      // Date tick where the due date changes.
      if (t.due && t.due !== lastDue) {
        sctx.fillStyle = "#8fd3ff"; sctx.fillRect(first.x, first.y - 5, 1, 5);
        if (first.y !== lastDate.y || first.x >= lastDate.x) { sctx.fillText(fmt(t.dueDate), first.x + 3, first.y - 15); lastDate = { y: first.y, x: first.x + 44 }; }
        lastDue = t.due;
      }
      void last;
    }
    // Planned position today and the done boundary, at cell granularity.
    if (m.core) {
      const flat = tasks.flatMap(t => t.strip.cells.map(c => ({ ...c, t })));
      const nPlanned = tasks.filter(t => t.dueDate <= TODAY).reduce((s, t) => s + t.strip.n, 0);
      const nDone = tasks.filter(t => t.state === "done").reduce((s, t) => s + t.strip.n, 0);
      const at = n => n >= flat.length ? { x: flat[flat.length - 1].x + S.cell, y: flat[flat.length - 1].y } : flat[n];
      const p = at(nPlanned);
      sctx.fillStyle = "#ffd23f"; sctx.beginPath(); sctx.moveTo(p.x - 4, p.y - 6); sctx.lineTo(p.x + 4, p.y - 6); sctx.lineTo(p.x, p.y - 1); sctx.fill();
      sctx.fillRect(p.x, p.y, 1, S.cell);
      if (nDone > 0) { const d = at(nDone); sctx.fillStyle = "#fff"; sctx.fillRect(d.x - 1, d.y - 2, 2, S.cell + 4); }
    }
  }
}

// ── Cartouche ────────────────────────────────────────────────────────────
function renderCartouche() {
  const delta = M.doneEffort - M.plannedEffort;
  const cls = Math.abs(delta) < 0.05 ? "even" : delta > 0 ? "ahead" : "behind";
  document.getElementById("cToday").textContent = fmtLong(TODAY) + (params.get("today") ? " (SET)" : "");
  document.getElementById("cDone").textContent = `${fmtDays(M.doneEffort)} / ${fmtDays(M.total)}`;
  document.getElementById("cPlanned").textContent = fmtDays(M.plannedEffort);
  const dEl = document.getElementById("cDelta"); dEl.className = "v big " + cls;
  dEl.textContent = (delta >= 0 ? "+" : "−") + fmtDays(Math.abs(delta)) + (cls === "even" ? " · ON PLAN" : cls === "ahead" ? " · AHEAD" : " · BEHIND");
  document.getElementById("cStarted").textContent = M.all.filter(t => t.state === "started").map(t => t.id.slice(3)).join(" ") || "—";
  const pockets = M.core.filter(t => t.pocket);
  document.getElementById("cOverdue").innerHTML = pockets.length ? `<span class="behind">${pockets.length} · ${pockets.map(t => t.id.slice(3)).join(" ")}</span>` : "NONE";
  const next = M.core.filter(t => t.state !== "done" && t.dueDate > TODAY).sort((a, b) => a.dueDate - b.dueDate)[0];
  document.getElementById("cNext").textContent = next ? `${next.id} · ${fmt(next.dueDate)}` : "—";
  const gen = new Date(progress.generatedAt); const stale = Date.now() - gen > STALE_MS;
  const u = document.getElementById("cUpdated"); u.className = "v" + (stale ? " stale" : "");
  u.textContent = (progress.fixture ? "FIXTURE · " : "LINEAR · ") + gen.toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }).toUpperCase() + (stale ? " · STALE" : "");
  document.getElementById("fNote").textContent = SIM != null ? `SIMULATION: FIRST ${SIM} DAYS MARKED DONE` : `${M.core.length} TASKS TO SUBMISSION · ${M.critical.size} ON THE CRITICAL PATH`;
}

// ── Interaction ──────────────────────────────────────────────────────────
const tip = document.getElementById("tip");
function stateWord(t) { return t.pocket ? "OVERDUE" : t.salient ? "DONE · AHEAD" : t.state.toUpperCase().replace("STARTED", "IN PROGRESS").replace("TODO", "TO DO"); }
function showTip(t, ev) {
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = `<span class="id">${t.id}</span> <span class="meta">${t.issue || ""}</span><br>${t.title}<br><span class="meta">${t.milestoneName || ""}</span><br>` +
    `${stateWord(t)} · ${t.effort != null ? fmtDays(t.effort) : "?"}${t.dueDate ? " · DUE " + fmt(t.dueDate) : ""}${t.critical ? " · CRITICAL PATH" : ""}` +
    (t.blockedBy.length ? `<br><span class="meta">NEEDS ${t.blockedBy.map(b => b.slice(3)).join(" ")}</span>` : "") +
    (t.blocks.length ? `<br><span class="meta">UNBLOCKS ${t.blocks.map(b => b.slice(3)).join(" ")}</span>` : "");
  tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, window.innerWidth - 310), y = Math.min(ev.clientY + 14, window.innerHeight - 140);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function figureTaskAt(ev) {
  const rect = figCanvas.getBoundingClientRect();
  const c = Math.floor((ev.clientX - rect.left) / rect.width * COLS), r = Math.floor((ev.clientY - rect.top) / rect.height * ROWS);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  const k = cellOrder[r * COLS + c]; return k >= 0 ? cellTask[k] : null;
}
function stripTaskAt(ev) {
  const rect = strip.getBoundingClientRect(); const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  const h = stripHits.find(h => x >= h.x && x < h.x + h.w && y >= h.y - 6 && y < h.y + h.h + 14); return h ? h.t : null;
}
for (const [el, fn] of [[figCanvas, figureTaskAt], [strip, stripTaskAt]]) {
  el.addEventListener("pointermove", ev => { hoverTask = fn(ev); showTip(hoverTask, ev); });
  el.addEventListener("pointerleave", () => { hoverTask = null; showTip(null); });
  el.addEventListener("click", ev => { const t = fn(ev); if (t && t.url) window.open(t.url, "_blank"); });
}
const callout = document.getElementById("callout");
function showCallout(m, ev) {
  const rows = [...m.tasks].sort((a, b) => (a.due || "9").localeCompare(b.due || "9") || a.level - b.level || a.id.localeCompare(b.id)).map(t => {
    const cls = t.pocket ? "s-pocket" : "s-" + t.state; const glyph = t.state === "done" ? "■" : t.state === "started" ? "▣" : t.pocket ? "✕" : t.state === "blocked" ? "▨" : "□";
    return `<span class="${cls}">${glyph}</span><span class="${cls}">${t.id}</span><span title="${t.title}">${t.title}</span><span class="${cls}">${t.dueDate ? fmt(t.dueDate) : ""}</span>`;
  }).join("");
  document.getElementById("calloutBody").innerHTML = `<h3>${m.id} ${m.name} · ${fmtDays(m.effort)} · ${m.done}/${m.tasks.length}</h3><div class="t">${rows}</div>`;
  callout.style.display = "block";
  const w = Math.min(360, window.innerWidth - 24);
  callout.style.left = Math.max(12, Math.min(ev.clientX - w / 2, window.innerWidth - w - 12)) + "px";
  callout.style.top = Math.min(ev.clientY + 12, window.innerHeight - 200) + "px";
}
callout.querySelector(".x").addEventListener("click", () => callout.style.display = "none");
document.addEventListener("click", ev => { if (!callout.contains(ev.target)) callout.style.display = "none"; });

// ── Errors on the page, so a phone can report them ───────────────────────
function showError(msg) {
  const u = document.getElementById("cUpdated"); u.className = "v stale"; u.textContent = "ERROR · " + msg;
  document.getElementById("fNote").textContent = "ERROR · " + msg;
}
window.addEventListener("error", e => showError(e.message || String(e)));
window.addEventListener("unhandledrejection", e => showError((e.reason && e.reason.message) || String(e.reason)));

// ── Main ─────────────────────────────────────────────────────────────────
async function refreshProgress(force) {
  try {
    const p = await loadJSON("data/progress.json?t=" + Date.now());
    if (!force && progress && p.generatedAt === progress.generatedAt) return;
    progress = p; buildModel(); layoutStrip(); buildOverlay(); renderCartouche(); if (!modelFrames) drawStatic();
  } catch (e) { console.error(e); document.getElementById("cUpdated").innerHTML = `<span class="stale">NO DATA · ${e.message}</span>`; }
}
function tick(now) {
  if (M && now - lastTick >= FRAME_MS) { lastTick = now; frameIdx++; drawFigure(frameIdx); drawStrip(frameIdx); }
  requestAnimationFrame(tick);
}
(async () => {
  try {
    [sheetDay, sheetNight, body] = await Promise.all([loadImage("glyphs.png"), loadImage("glyphs_night.png"), loadJSON("data/body.json")]);
    ROWS = body.rows; COLS = body.cols;
    figCanvas.width = COLS * CELL; figCanvas.height = ROWS * CELL;
    buildBody();
    await refreshProgress(true);
  } catch (e) { showError(e.message); return; }
  setInterval(() => refreshProgress(false), REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshProgress(false); });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (M) { layoutStrip(); buildOverlay(); if (!modelFrames) drawStatic(); } }, 150); });
  try {
    await loadFrames();
    requestAnimationFrame(tick);
  } catch (e) {
    console.error(e); drawStatic();
    document.getElementById("fNote").textContent = "STATIC RENDER · FRAMES UNAVAILABLE · " + e.message;
  }
})();
</script>
</body>
